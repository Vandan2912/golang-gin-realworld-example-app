zerops:
  - setup: api
    build:
      base: go@1.22
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y gcc libc6-dev
      buildCommands:
        - go build -o app .
      deployFiles: ./
      envVariables:
        CGO_ENABLED: '1'
        GIN_MODE: release
        DB_PATH: ./data/gorm.db
        PORT: '8080'
    run:
      base: go@1.22
      ports:
        - port: 8080
          httpSupport: true
      start: ./app
      envVariables:
        CGO_ENABLED: '1'
        GIN_MODE: release
        DB_PATH: ./data/gorm.db
        PORT: '8080'
